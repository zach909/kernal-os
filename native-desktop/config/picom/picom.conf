# KOS native desktop - compositor (picom): blur behind translucent panels, rounded corners, soft shadows.
backend = "glx";
vsync = true;

# Blur: the "glass" look behind translucent windows and the panel.
blur-method = "dual_kawase";
blur-strength = 6;
blur-background-exclude = [
  "window_type = 'dock' && class_g = 'Plank'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Rounded corners, but never on the panel or fullscreen windows.
corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "class_g = 'Polybar'",
  "fullscreen"
];

# Shadows
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.35;
shadow-offset-x = -12;
shadow-offset-y = -10;
shadow-exclude = [
  "class_g = 'Polybar'",
  "window_type = 'dock'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Smooth, short fades
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;

# Translucent terminals and menus; everything else stays opaque.
opacity-rule = [
  "92:class_g = 'Rofi'",
  "94:class_g = 'kitty'",
  "94:class_g = 'Alacritty'"
];

wintypes:
{
  dock = { shadow = false; blur-background = true; };
  tooltip = { fade = true; shadow = true; opacity = 0.95; };
  popup_menu = { opacity = 0.95; };
  dropdown_menu = { opacity = 0.95; };
};
