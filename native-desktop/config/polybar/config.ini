; KOS native desktop - top panel (polybar). Windows Blue #0078D4 marks what is active.
[colors]
background = #800d1016
background-alt = #33ffffff
foreground = #f2f6fc
muted = #a9b6c8
accent = #0078d4
accent-bright = #4cc2ff
alert = #ff6b6b

[bar/kos]
width = 100%
height = 30
offset-x = 0
offset-y = 0
radius = 0
fixed-center = true
bottom = false
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2
padding-left = 2
padding-right = 2
module-margin = 1
font-0 = Inter:size=10;3
font-1 = Inter:style=Bold:size=10;3
font-2 = Papirus:size=10;3
modules-left = kos title
modules-center = date
modules-right = cpu memory wired wireless audio
tray-position = right
tray-padding = 4
tray-background = ${colors.background}
wm-restack = generic
override-redirect = false
enable-ipc = true
cursor-click = pointer
; reaches the whole screen width on every monitor you start it for: polybar --reload kos

[module/kos]
type = custom/text
content = KOS
content-font = 2
content-padding = 2
content-foreground = ${colors.foreground}
click-left = rofi -show drun -theme ~/.config/rofi/kos.rasi
click-right = rofi -show run -theme ~/.config/rofi/kos.rasi

[module/title]
type = internal/xwindow
label = %title:0:48:...%
label-font = 2
label-foreground = ${colors.foreground}
label-empty = Desktop
label-empty-foreground = ${colors.muted}

[module/date]
type = internal/date
interval = 1
date = %a %d %b
time = %H:%M
label = %date%   %time%
label-font = 2
format-underline = ${colors.accent}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.muted}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 3
format-prefix = "Memory "
format-prefix-foreground = ${colors.muted}
label = %percentage_used:2%%

[module/wired]
type = internal/network
interface-type = wired
interval = 3
format-connected = <label-connected>
label-connected = Ethernet
label-connected-foreground = ${colors.accent-bright}
format-disconnected =

[module/wireless]
type = internal/network
interface-type = wireless
interval = 3
format-connected = <label-connected>
label-connected = %essid% %signal%%
label-connected-foreground = ${colors.accent-bright}
format-disconnected =

[module/audio]
type = internal/pulseaudio
format-volume = Vol <label-volume>
label-volume = %percentage%%
label-muted = Muted
label-muted-foreground = ${colors.muted}
click-right = pavucontrol

[settings]
screenchange-reload = true
pseudo-transparency = false
